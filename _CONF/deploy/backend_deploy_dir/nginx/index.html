<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #475569 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 80%, rgba(30, 41, 59, 0.4) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(51, 65, 85, 0.4) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            text-align: center;
            max-width: 520px;
            padding: 50px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(148, 163, 184, 0.1);
            position: relative;
            animation: slideIn 0.8s ease-out;
            z-index: 1;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            font-weight: 800;
            background: linear-gradient(45deg, #f1f5f9, #cbd5e1, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 2px 10px rgba(148, 163, 184, 0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 45px;
            font-weight: 300;
            color: #cbd5e1;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-bottom: 35px;
        }

        .menu-item {
            display: block;
            padding: 18px;
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            text-decoration: none;
            color: #e2e8f0;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(71, 85, 105, 0.4);
            position: relative;
            overflow: hidden;
        }

        .menu-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(100, 116, 139, 0.2), transparent);
            transition: left 0.6s;
        }

        .menu-item:hover::before {
            left: 100%;
        }

        .menu-item:hover {
            background: linear-gradient(135deg, #1e40af, #3b82f6, #60a5fa);
            transform: translateY(-5px) scale(1.02);
            box-shadow: 
                0 20px 40px rgba(30, 64, 175, 0.4),
                0 0 40px rgba(59, 130, 246, 0.3),
                inset 0 0 20px rgba(148, 163, 184, 0.1);
            border-color: rgba(59, 130, 246, 0.6);
        }

        .menu-item:nth-child(1):hover {
            background: linear-gradient(135deg, #1e40af, #3b82f6, #60a5fa);
            box-shadow: 
                0 20px 40px rgba(30, 64, 175, 0.4),
                0 0 40px rgba(59, 130, 246, 0.3),
                inset 0 0 20px rgba(148, 163, 184, 0.1);
        }

        .emoji {
            font-size: 2.8rem;
            margin-right: 15px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));
        }

        .emoji#check {
            font-size: 1.2rem;
            margin-right: 0px;
        }

        .status-container {
            position: relative;
            padding: 20px;
        }

        .developers-badge {
            position: absolute;
            top: -6px;
            right: 2px;
            background: linear-gradient(45deg, #7c3aed, #8b5cf6);
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 6px 10px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
            border: 1px solid rgba(139, 92, 246, 0.3);
            z-index: 10;
            animation: pulse-badge 2s infinite;
        }

        @keyframes pulse-badge {
            0%, 100% { 
                box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 6px 20px rgba(124, 58, 237, 0.6);
                transform: scale(1.05);
            }
        }

        .menu-item:hover .developers-badge {
            background: linear-gradient(45deg, #6d28d9, #7c3aed);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.6);
        }

        .menu-content {
            display: flex;
            align-items: center;
            gap: 18px;
            z-index: 2;
            position: relative;
        }

        .menu-title {
            font-size: 17px;
            font-weight: 700;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
            color: #f1f5f9;
        }

        .powered-by {
            position: absolute;
            bottom: 10px;
            right: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 2;
        }

        .powered-text {
            font-size: 11px;
            opacity: 0.7;
            font-weight: 400;
            color: #94a3b8;
        }

        .logo-img {
            width: 28px;
            height: 28px;
            filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.4)) brightness(0.9);
            transition: transform 0.3s ease;
        }

        .menu-item:hover .logo-img {
            transform: scale(1.1);
            filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.4)) brightness(1.1);
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px;
                padding: 35px;
            }
            
            h2 {
                font-size: 2.3rem;
            }

            .menu-item {
                padding: 16px;
            }

            .emoji {
                font-size: 2.4rem;
            }
        }

        /* Animation d'entrée séquentielle pour les éléments du menu */
        .menu-item:nth-child(1) { animation: slideInLeft 0.6s ease-out 0.2s both; }
        .menu-item:nth-child(2) { animation: slideInLeft 0.6s ease-out 0.4s both; }
        .menu-item:nth-child(3) { animation: slideInLeft 0.6s ease-out 0.6s both; }
        .menu-item:nth-child(4) { animation: slideInLeft 0.6s ease-out 0.8s both; }
        .status-container { animation: slideInLeft 0.6s ease-out 1.0s both; }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🚗 Getaround Backend</h2>
        <p class="subtitle">Choose option</p>
        
        <div class="menu">
            
            <a href="/api-backend/docs" target="_blank" class="menu-item">
                <div class="developers-badge">Developers only</div>
                <div class="menu-content">
                    <span class="emoji">🔧</span>
                    <div class="menu-title">Back end API</div>
                </div>
                <div class="powered-by">
                    <small class="powered-text">powered by FastAPI</small>
                    <img src="https://fastapi.tiangolo.com/img/icon-white.svg" alt="FastAPI" class="logo-img">
                </div>
            </a>

            <a href="/mlflow/" target="_blank" class="menu-item">
                <div class="developers-badge">Developers only</div>
                <div class="menu-content">
                    <span class="emoji"><img src="../../img/mlflow_icon.png" alt="MLFlow_icon" style="width: 45px; height: 45px; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));"></span>
                    <div class="menu-title">MLFlow tracking
                        <small class="powered-text">password="getaround_pwd"</small>
                    </div>
                    
                </div>
                <div class="powered-by">
                    <small class="powered-text">powered by MLFlow</small>
                    <img src="../../img/mlflow_logo.svg" alt="MLFlow" class="logo-img">
                </div>
            </a>
        </div>

        <div class="status-container">
            <div class="menu-content">
                <span class="emoji" id="check">✅</span>
                <div style="font-size: 17px; font-weight: 500; color: #cbd5e1;">Reverse proxy up & running</div>
            </div>
            <div class="powered-by">
                <small class="powered-text">powered by nginx</small>
                <img src="../../img/nginx-svgrepo-com.svg" alt="nginx" class="logo-img">
            </div>
        </div>
    </div>
</body>
</html>
