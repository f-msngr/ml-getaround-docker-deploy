# _CONF/deploy/frontend_deploy_dir/nginx/default.conf
#user www-data;
worker_processes auto;
#pid /run/nginx.pid;
pid /tmp/nginx.pid;
#error_log /var/log/nginx/error.log;
error_log /tmp/error.log;
#include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {
    # Rediriger TOUS les répertoires temporaires
    client_body_temp_path /tmp/client_body_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    
    # Logs accessibles
    access_log /tmp/access.log;

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	gzip on;

    server {
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        
        listen ${PORT_REV_PROXY_FRONTEND_EXTERNAL};

        location / {
            # Configuration index.html
            root /etc/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }

        location /dashboard/ {
            #proxy_pass http://dashboard:8501/dashboard/;
            proxy_pass http://127.0.0.1:${PORT_STREAMLIT_EXTERNAL}/dashboard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Websockets Configuration - allow Streamlit accessibility on /dashboard/ and not on default /
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
        
        location /api/ {
            #proxy_pass http://api:8000/;
            proxy_pass http://127.0.0.1:${PORT_FASTAPI_EXTERNAL}/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Activate Swagger /docs/
            proxy_set_header X-Forwarded-Proto $scheme;
            #proxy_set_header X-Forwarded-Prefix /api;
        }
        
    }
}


